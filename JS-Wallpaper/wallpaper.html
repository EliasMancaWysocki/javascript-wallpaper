<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Interactivo</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modules/dev-panel.css">
</head>

<body>
    <div id="wallpaper">
        <p class="clock" id="container">
<span class='mediumpurple'>var</span> data <span class='deepskyblue'>=</span> <span class='cornflowerblue'>{</span>
    <span class='greenyellow'>time:</span> <span class='sandybrown'>"</span><span id='time'>00:00:00</span><span class='sandybrown'>"</span>,
    <span class='greenyellow'>date:</span> <span class='sandybrown'>"</span><span id='date'>2026-01-01</span><span class='sandybrown'>"</span>,
    <span class='greenyellow'>weather:</span> <span id='weather-value'><span class='mediumpurple'>null</span>,</span>
    <span class='greenyellow'>media:</span> <span id='media-value'><span class='mediumpurple'>null</span></span>
<span class='cornflowerblue'>}</span>
        </p>
    </div>

    <!-- Panel de desarrollo: visible fuera de Wallpaper Engine o con la tecla D -->
    <div id="dev-panel">
        <h3>// dev — weather test</h3>

        <label>
            wind speed: <span class="val" id="dev-wind-val">0</span> km/h
            <input type="range" id="dev-wind-speed" min="0" max="100" value="0">
        </label>
        <label>
            wind dir: <span class="val" id="dev-dir-val">90° E</span>
            <input type="range" id="dev-wind-dir" min="0" max="359" value="90">
        </label>

        <hr>
        <h3>// condition</h3>
        <div class="dev-row" id="dev-condition-row">
            <button data-condition="Sunny">☀ Sunny</button>
            <button data-condition="Partly cloudy">⛅ Cloudy</button>
            <button data-condition="Light rain">🌧 Rain</button>
            <button data-condition="Thunderstorm">⛈ Storm</button>
            <button data-condition="Blizzard">❄ Snow</button>
            <button data-condition="clear">✕ Clear</button>
        </div>

        <hr>
        <h3>// season override</h3>
        <div class="dev-row" id="dev-season-row">
            <button data-season="autumn">🍂 Otoño</button>
            <button data-season="winter">🌨 Invierno</button>
            <button data-season="spring">🌸 Primavera</button>
            <button data-season="summer">🌿 Verano</button>
            <button data-season="auto">↺ Auto</button>
        </div>

        <hr>
        <h3>// time of day</h3>
        <label>
            hour: <span class="val" id="dev-hour-val">12:00 ☀</span>
            <input type="range" id="dev-hour" min="0" max="23" value="12">
        </label>
        <div class="dev-row">
            <button id="dev-hour-auto">↺ Auto</button>
        </div>

        <hr>
        <h3>// moon phase</h3>
        <label>
            phase: <span class="val" id="dev-moon-val">🌕 Llena</span>
            <input type="range" id="dev-moon" min="0" max="7" value="4">
        </label>
    </div>

    <button id="dev-toggle">dev</button>

    <script src="modules/state.js"></script>
    <script src="modules/dom-helpers.js"></script>
    <script src="modules/animation-loop.js"></script>
    <script src="modules/moon.js"></script>
    <script src="modules/sky.js"></script>
    <script src="modules/mountains.js"></script>
    <script src="modules/precipitation.js"></script>
    <script src="modules/clouds.js"></script>
    <script src="modules/storm.js"></script>
    <script src="modules/leaves.js"></script>
    <script src="modules/weather-effects.js"></script>
    <script src="modules/weather-view.js"></script>
    <script src="modules/http-client.js"></script>
    <script src="modules/moon-phase.js"></script>
    <script src="modules/location-resolver.js"></script>
    <script src="modules/weather-providers/open-meteo.js"></script>
    <script src="modules/weather-api.js"></script>
    <script src="modules/clock.js"></script>
    <script src="modules/media.js"></script>
    <script src="modules/we-properties.js"></script>
    <script src="modules/main.js"></script>
    <script src="modules/dev-panel.js"></script>
</body>

</html>
